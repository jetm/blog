{{- /* Toolbar Plugin CSS */ -}}

      href="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/plugins/toolbar/prism-toolbar.min.css"
      crossorigin="anonymous"

{{- /* Fallback styles for when JavaScript is disabled */ -}}
<noscript>
<style>
pre[class*="language-"],
code[class*="language-"] {
    font-family: 'Fira Code', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', monospace;
    font-size: 0.9em;
    line-height: 1.5;
    background: var(--code-block-bg, #1d1f21);
    color: var(--primary, #c5c8c6);
    padding: 1em;
    margin: 0.5em 0;
    overflow: auto;
    border-radius: 0.3em;
    white-space: pre;
    word-spacing: normal;
    word-break: normal;
    word-wrap: normal;
    tab-size: 4;
}
code[class*="language-"] {
    padding: 0;
    background: transparent;
}
</style>
</noscript>
