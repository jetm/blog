baseURL: "https://jetm.github.io/blog/"
languageCode: "en-us"
title: "My New Hugo Site"
theme: "PaperMod"

# Pagination
pagination:
  pagerSize: 10

# Build configuration
buildDrafts: false
buildFuture: false
buildExpired: false

# Output formats
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Markup configuration
markup:
  highlight:
    codeFences: false
    guessSyntax: true
    lineNos: false
    noClasses: true
    style: monokai

# RSS configuration
rss:
  limit: 20

# Privacy settings
privacy:
  disqus:
    disable: true
  googleAnalytics:
    disable: true

# PaperMod theme parameters
params:
  # Environment
  env: production

  # SEO metadata
  description: "Technical articles and tutorials"
  author: "Your Name"

  # Dark mode toggle
  defaultTheme: auto
  disableThemeToggle: false

  # Reading time
  ShowReadingTime: true

  # Table of Contents
  ShowToc: true
  TocOpen: false

  # Share buttons
  ShowShareButtons: true
  ShareButtons:
    - linkedin
    - twitter

  # Post metadata
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true

  # Home page
  homeInfoParams:
    Title: "Welcome"
    Content: "Welcome to my blog"

  # Analytics
  goatcounter:
    code: "jetm"

  # Social icons
  socialIcons:
    - name: "github"
      url: "https://github.com/username"
    - name: "twitter"
      url: "https://twitter.com/username"
    - name: "linkedin"
      url: "https://linkedin.com/in/username"
    - name: "rss"
      url: "/index.xml"

# Menu configuration
menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 1
    - identifier: about
      name: About
      url: /about/
      weight: 2
    - identifier: search
      name: Search
      url: /search/
      weight: 3
