baseURL: "https://jetm.github.io/blog/"
languageCode: "en-us"
title: "Javier Tia's Blog"
theme: "PaperMod"
enableRobotsTXT: true

# Taxonomies
taxonomies:
  tag: "tags"
  category: "categories"

# Pagination
pagination:
  pagerSize: 10

# Build configuration
buildDrafts: false
buildFuture: false
buildExpired: false

# Output formats
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Markup configuration
markup:
  highlight:
    codeFences: false

# RSS configuration
rss:
  limit: 20

# Privacy settings
privacy:
  disqus:
    disable: true
  googleAnalytics:
    disable: true

# Image processing configuration
imaging:
  quality: 75
  resampleFilter: Lanczos
  anchor: Smart

# PaperMod theme parameters
params:
  # Environment
  env: production

  # SEO metadata
  description: "Systems programming, Linux internals, and developer tooling — hands-on technical articles from the field"
  author: "Javier Tia"

  # Dark mode toggle
  defaultTheme: auto
  disableThemeToggle: false

  # Reading time
  ShowReadingTime: true

  # Table of Contents
  ShowToc: true
  TocOpen: false

  # Share buttons
  ShowShareButtons: false

  # Post metadata
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true

  # Home page
  homeInfoParams:
    Title: "Systems & Linux Engineering"
    Content: "Technical deep-dives into Linux internals, kernel development, and systems programming"

  # Analytics
  goatcounter:
    code: "jetm"

  # Image processing parameters
  imageProcessing:
    quality: 75
    formats:
      - webp
    lazyLoading: true
    responsiveSizes:
      - 360
      - 480
      - 720
      - 1080
      - 1500

  # Social icons
  socialIcons:
    - name: "github"
      url: "https://github.com/jetm/"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/javiertia/"
    - name: "rss"
      url: "index.xml"

# Menu configuration
menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 1
    - identifier: about
      name: About
      url: /about/
      weight: 2
    - identifier: search
      name: Search
      url: /search/
      weight: 3
