default_language_version:
  python: python3

fail_fast: false

repos:
  # Markdown linting
  - repo: local
    hooks:
      - id: mado
        name: mado
        entry: mado check
        language: system
        types: [markdown]
        # No exclude here on purpose. pre-commit only ever hands this hook
        # tracked, non-ignored files, so public/, resources/ and the themes
        # submodule cannot reach it; and a pattern written here would not apply
        # to `mado check .`, which walks the tree. mado.toml is the one place
        # that covers both callers.

  # Local hooks - TOML formatting and linting
  - repo: local
    hooks:
      - id: tombi-format
        name: tombi format
        entry: tombi format
        language: system
        types: [toml]
      - id: tombi-lint
        name: tombi lint
        entry: tombi lint
        language: system
        types: [toml]
